<div id="dailyone-prototype" class="viz-dotted-background">
<style>
#dailyone-prototype{--do-bg:light-dark(#fff,#191b1e);--do-text:light-dark(#24282c,#ecedef);--do-sub:light-dark(#858b92,#9a9fa6);--do-line:light-dark(#edf0f2,#303338);--do-soft:light-dark(#f6f8fa,#23272b);--do-blue:light-dark(#168ccc,#58b6ef);font-family:Roboto,"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--do-text);padding:28px 0;color-scheme:light dark}
#dailyone-prototype *{box-sizing:border-box}#dailyone-prototype button,#dailyone-prototype input,#dailyone-prototype textarea{font:inherit}#dailyone-prototype button{cursor:pointer}#dailyone-prototype .phone{width:min(390px,100%);margin:auto;background:var(--do-bg);border:1px solid var(--do-line);border-radius:28px;box-shadow:0 18px 65px #00000010;overflow:hidden;position:relative;height:782px}#dailyone-prototype .status{height:36px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:500}#dailyone-prototype .signal{display:flex;align-items:center;gap:5px}#dailyone-prototype .signal i{width:13px;height:13px}#dailyone-prototype .appbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--do-line)}#dailyone-prototype button.icon{border:0;background:transparent;color:var(--do-sub);width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}#dailyone-prototype button.icon:hover{background:var(--do-soft)}#dailyone-prototype .icon svg{width:21px;height:21px}#dailyone-prototype .journal-name{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:500;flex:1;margin-left:10px}#dailyone-prototype .journal-name i{color:var(--do-blue);width:21px}#dailyone-prototype .blue{color:var(--do-blue)!important}#dailyone-prototype .meta-bar{height:45px;padding:0 23px;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.3px;color:var(--do-sub)}#dailyone-prototype .sync{display:flex;align-items:center;gap:5px}#dailyone-prototype .sync i{width:13px;height:13px}#dailyone-prototype .month{padding:19px 23px 16px;font-size:14px;font-weight:500;border-bottom:1px solid var(--do-line)}#dailyone-prototype .month span{color:var(--do-sub);font-weight:400;margin-left:5px}#dailyone-prototype .entries{padding-bottom:80px;height:597px;overflow-y:auto}#dailyone-prototype .entry{width:100%;padding:22px 23px;display:grid;grid-template-columns:39px minmax(0,1fr);gap:16px;text-align:left;background:none;border:0;border-bottom:1px solid var(--do-line);color:var(--do-text)}#dailyone-prototype .entry:hover{background:var(--do-soft)}#dailyone-prototype .day{font-size:29px;line-height:1;font-weight:400;letter-spacing:-1px}#dailyone-prototype .dow{font-size:11px;color:var(--do-sub);margin-top:6px;letter-spacing:0}#dailyone-prototype .entry-time{font-size:11px;color:var(--do-sub);margin-bottom:9px}#dailyone-prototype .entry-title{font-size:15px;line-height:1.5;font-weight:500;margin-bottom:5px}#dailyone-prototype .excerpt{font-size:13px;line-height:1.8;color:var(--do-sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#dailyone-prototype .scene{height:137px;margin-top:13px;border-radius:4px;overflow:hidden;position:relative;background:linear-gradient(#b6cad1 0%,#d9ded7 48%,#7f9b95 49%,#aac0bb 65%,#78918a);isolation:isolate}#dailyone-prototype .scene:before{content:"";position:absolute;inset:29% -12% 31%;background:#658482;clip-path:polygon(0 85%,19% 20%,30% 56%,48% 5%,68% 75%,87% 31%,100% 90%,100% 100%,0 100%)}#dailyone-prototype .scene:after{content:"";position:absolute;inset:52% -15% -20%;background:linear-gradient(158deg,transparent 35%,#d0cbb8 36%,#9c9e83 50%,#425b51 51%);transform:rotate(-6deg)}#dailyone-prototype .scene.sunset{background:linear-gradient(#d2b9ab,#ecd6b2 52%,#b4b9ad 53%,#829fa0)}#dailyone-prototype .scene.sunset:before{background:#86948e}#dailyone-prototype .scene.sunset:after{background:linear-gradient(158deg,transparent 42%,#cebc9f 43%,#9b9983 60%,#647b70 61%)}#dailyone-prototype .fab{position:absolute;bottom:34px;right:23px;width:57px;height:57px;border:0;border-radius:50%;background:var(--do-blue);color:white;box-shadow:0 4px 10px #168ccc35;display:grid;place-items:center}#dailyone-prototype .fab svg{width:27px;height:27px}#dailyone-prototype .gesture{position:absolute;bottom:9px;left:calc(50% - 45px);height:4px;width:90px;background:var(--do-text);border-radius:9px;opacity:.85}#dailyone-prototype [hidden]{display:none!important}#dailyone-prototype .editor-head{border-bottom:0}#dailyone-prototype .editor-head .date-top{flex:1;font-size:14px;text-align:center;font-weight:500}#dailyone-prototype .done{border:0;background:none;color:var(--do-blue);font-size:14px;padding:12px;min-height:44px}#dailyone-prototype .editor-body{padding:12px 26px 100px;height:640px;overflow-y:auto}#dailyone-prototype .date-detail{display:flex;align-items:center;gap:8px;color:var(--do-sub);font-size:11px;margin-bottom:25px}#dailyone-prototype .date-detail i{width:13px;height:13px}#dailyone-prototype .title-input{width:100%;border:0;background:transparent;outline:none;font-size:23px;font-weight:500;color:var(--do-text);padding:0;margin:0 0 18px}#dailyone-prototype .body-input{display:block;width:100%;min-height:190px;resize:vertical;border:0;outline:none;background:transparent;font-size:16px;line-height:1.95;color:var(--do-text);padding:0}#dailyone-prototype .title-input::placeholder,#dailyone-prototype .body-input::placeholder{color:var(--do-sub)}#dailyone-prototype .editor-body .scene{height:205px;margin:15px 0 20px}#dailyone-prototype .editor-tools{height:53px;position:absolute;bottom:24px;left:0;right:0;background:var(--do-bg);border-top:1px solid var(--do-line);display:flex;align-items:center;padding:0 12px;gap:9px}#dailyone-prototype .saved{font-size:11px;color:var(--do-sub);margin-left:auto;padding-right:12px}#dailyone-prototype .overlay{position:absolute;inset:36px 0 0;background:#0005;z-index:3;display:flex;align-items:flex-end}#dailyone-prototype .sheet{width:100%;padding:12px 24px 35px;background:var(--do-bg);border-radius:23px 23px 0 0}#dailyone-prototype .handle{width:34px;height:4px;border-radius:4px;background:var(--do-line);margin:0 auto 20px}#dailyone-prototype .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;font-size:18px;font-weight:500}#dailyone-prototype .sheet label{display:block;font-size:12px;color:var(--do-sub);margin:18px 0 7px}#dailyone-prototype .sheet input{width:100%;border:1px solid var(--do-line);background:var(--do-soft);padding:12px;border-radius:7px;color:var(--do-text);font-size:14px}#dailyone-prototype .provider{display:flex;align-items:center;gap:12px;background:var(--do-soft);padding:15px;border-radius:9px;font-size:14px}#dailyone-prototype .provider i{width:22px;color:var(--do-blue)}#dailyone-prototype .provider small{margin-left:auto;color:var(--do-blue)}#dailyone-prototype .primary{width:100%;padding:14px;border-radius:8px;color:white;background:var(--do-blue);border:0;margin-top:22px;font-size:14px}#dailyone-prototype .hint{font-size:11px;line-height:1.7;color:var(--do-sub);margin:15px 0 0}#dailyone-prototype .toast{position:absolute;bottom:102px;left:24px;right:24px;padding:13px 17px;background:var(--do-text);color:var(--do-bg);font-size:12px;border-radius:8px;z-index:5;text-align:center}#dailyone-prototype .attachment{max-width:100%;display:block;border-radius:4px;margin:15px 0}#dailyone-prototype .empty{padding:60px 25px;color:var(--do-sub);text-align:center;font-size:14px}#dailyone-prototype button:focus-visible,#dailyone-prototype input:focus-visible,#dailyone-prototype textarea:focus-visible{outline:2px solid var(--do-blue);outline-offset:3px}@media(max-width:430px){#dailyone-prototype{padding:0}#dailyone-prototype .phone{border-radius:0;border:0;box-shadow:none}}
</style>
<div class="phone">
<div class="status"><span>9:41</span><span class="signal"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
<section id="do-list">
<header class="appbar"><div class="journal-name"><i data-lucide="book-open" aria-hidden="true"></i>我的日记</div><button class="icon" id="do-settings" aria-label="云存储设置"><i data-lucide="settings-2" aria-hidden="true"></i></button></header>
<div class="meta-bar"><span id="do-count">4 篇日记</span><span class="sync"><i data-lucide="cloud" aria-hidden="true"></i><span id="do-cloud">仅保存在本机</span></span></div>
<div class="month">10月 <span>2026</span></div><div class="entries" id="do-entries"></div>

</section>
<section id="do-editor" hidden><header class="appbar editor-head"><button class="icon" id="do-back" aria-label="保存并返回"><i data-lucide="arrow-left" aria-hidden="true"></i></button><div class="date-top" id="do-date">2026年10月31日</div><button class="done" id="do-done">完成</button></header><div class="editor-body"><div class="date-detail"><i data-lucide="clock-3" aria-hidden="true"></i><span id="do-time">09:41</span><span>·</span><span id="do-weekday">星期六</span></div><input id="do-title" class="title-input" placeholder="标题" aria-label="日记标题"><textarea id="do-body" class="body-input" placeholder="记下这一刻……" aria-label="日记正文"></textarea><div id="do-editor-media"></div></div><footer class="editor-tools"><button class="icon blue" id="do-image" aria-label="插入图片"><i data-lucide="image" aria-hidden="true"></i></button><span class="saved" id="do-saved" aria-live="polite">已保存到本机</span></footer><input type="file" accept="image/*" id="do-file" hidden></section>

</div>
<script>
(()=>{const root=document.getElementById('dailyone-prototype'),q=s=>root.querySelector(s);const seed=[{id:1,day:'31',dow:'周六',time:'09:41',title:'把日子过慢一点',body:'早上沿着湖边走了很久，没有目的地。\n\n风吹过来的时候，突然觉得，能这样安安静静地待一会儿就很好。',scene:'lake'},{id:2,day:'30',dow:'周五',time:'18:26',title:'下班路上的晚霞',body:'今天特意提前一站下车。天边的颜色一点点变暖，走回家的这段路，也变成了今天最喜欢的时刻。',scene:'sunset'},{id:3,day:'29',dow:'周四',time:'22:08',title:'普通的一天，也值得记下',body:'煮了一杯咖啡，读完了搁置很久的几页书。\n\n没发生什么特别的事，但心情很好。'},{id:4,day:'28',dow:'周三',time:'20:15',title:'开始记录',body:'不必写得多好。留下一点文字，以后就能想起今天。'}];let entries=seed.map(x=>({...x})),current=null,images=[],timer;const icons=()=>{if(typeof lucide!=='undefined')lucide.createIcons()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{q('#do-toast').textContent=t;q('#do-toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>q('#do-toast').hidden=true,2500)};function render(){q('#do-count').textContent=entries.length+' 篇日记';q('#do-entries').innerHTML=entries.map(e=>`<button class="entry" data-id="${e.id}"><div><div class="day">${e.day}</div><div class="dow">${e.dow}</div></div><div><div class="entry-time">${e.time}</div><div class="entry-title">${esc(e.title||'无标题')}</div><div class="excerpt">${esc(e.body)}</div>${e.images?.length?`<img class="attachment" src="${e.images[0]}" alt="日记图片">`:e.scene?`<div class="scene ${e.scene==='sunset'?'sunset':''}" role="img" aria-label="湖畔风景示意图"></div>`:''}</div></button>`).join('');q('#do-entries').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(Number(b.dataset.id)))}function media(){q('#do-editor-media').innerHTML=(current.scene?`<div class="scene ${current.scene==='sunset'?'sunset':''}" role="img" aria-label="湖畔风景示意图"></div>`:'')+images.map(src=>`<img class="attachment" src="${src}" alt="日记图片">`).join('')}function open(id){current=id?{...entries.find(e=>e.id===id)}:{id:Date.now(),day:'31',dow:'周六',time:'09:41',title:'',body:''};images=[...(current.images||[])];q('#do-title').value=current.title;q('#do-body').value=current.body;q('#do-date').textContent='2026年10月'+current.day+'日';q('#do-time').textContent=current.time;q('#do-weekday').textContent={周三:'星期三',周四:'星期四',周五:'星期五',周六:'星期六'}[current.dow];q('#do-list').hidden=true;q('#do-editor').hidden=false;q('#do-saved').textContent='已保存到本机';media()}function save(){if(!current)return;current.title=q('#do-title').value;current.body=q('#do-body').value;current.images=[...images];if(!current.title.trim()&&!current.body.trim()&&!images.length&&!current.scene)return;const idx=entries.findIndex(e=>e.id===current.id);if(idx>=0)entries[idx]={...current};else entries.unshift({...current});q('#do-saved').textContent='已保存到本机';persist()}function persist(){if(window.openai?.setWidgetState){const compact=entries.map(({images,...e})=>e);window.openai.setWidgetState({modelContent:{screen:q('#do-editor').hidden?'list':'editor'},privateContent:{entries:compact}}).catch(()=>{})}}function back(){save();q('#do-editor').hidden=true;q('#do-list').hidden=false;current=null;render();persist()}q('#do-new').onclick=()=>open();q('#do-back').onclick=back;q('#do-done').onclick=back;['#do-title','#do-body'].forEach(s=>q(s).addEventListener('input',()=>{q('#do-saved').textContent='保存中…';save()}));q('#do-settings').onclick=()=>{q('#do-overlay').hidden=false;q('#do-close').focus()};q('#do-close').onclick=()=>{q('#do-overlay').hidden=true;q('#do-settings').focus()};q('#do-overlay').onclick=e=>{if(e.target===q('#do-overlay'))q('#do-close').click()};q('#do-connect').onclick=()=>{const url=q('#do-url').value;try{if(!/^https?:$/.test(new URL(url).protocol))throw Error()}catch{toast('请输入有效的服务器地址');return}q('#do-overlay').hidden=true;q('#do-pass').value='';toast('配置演示完成 · 尚未连接云存储')};q('#do-image').onclick=()=>q('#do-file').click();q('#do-file').onchange=()=>{const file=q('#do-file').files[0];if(!file)return;if(file.size>5*1024*1024){toast('原型支持 5 MB 以内的图片');return}const reader=new FileReader();reader.onload=()=>{images.push(reader.result);media();save()};reader.readAsDataURL(file);q('#do-file').value=''};root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!q('#do-overlay').hidden)q('#do-close').click();if(e.key==='Tab'&&!q('#do-overlay').hidden){const nodes=[...q('#do-overlay').querySelectorAll('button,input')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});const restore=s=>{if(s?.privateContent?.entries?.length){entries=s.privateContent.entries.map(e=>({...e}));render()}};restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));render();icons();})();
</script>
</div>
